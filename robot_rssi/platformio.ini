; ============================================================
; ROBOT RSSI TRACKING — 1 project, 4 environment (4 board)
;
; Cach dung:
;   - Chon environment o thanh trang thai duoi cung VS Code
;   - Hoac dung lenh: pio run -e <ten_env> -t upload
;   - Hoac chay Task "Upload TAT CA 4 board" (xem .vscode/tasks.json)
;
; TRUOC KHI DUNG:
;   1. Cam tung board, chay "pio device list" de biet COM port
;   2. Bo dau ";" o dong upload_port tuong ung, dien dung cong
;   3. Nap "mcu" (Master) TRUOC, copy MAC tu Serial Monitor
;   4. Dien MAC do vao ca 2 file mtiny1/main.cpp va mtiny2/main.cpp
;      (bien masterMAC[])
; ============================================================

[env]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ---------- BEACON: ESP32-S3 SuperMini (deo tren nguoi) ----------
; board: adafruit_qtpy_esp32s3_n4r2 = 4MB Flash + 2MB PSRAM, khop S3 SuperMini
[env:s3_esp]
platform  = espressif32
board     = adafruit_qtpy_esp32s3_n4r2
build_src_filter = +<s3_esp/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = /dev/ttyACM0   ; Linux: dien dung cong sau khi cam (Windows: COM8)

; ---------- MASTER: NodeMCU ESP32 (0 do, phia truoc robot) ----------
[env:mcu]
platform  = espressif32
board     = nodemcu-32s
build_src_filter = +<mcu/*>
board_build.partitions = huge_app.csv
upload_port  = /dev/ttyUSB0   ; Linux (Windows: COM15)
monitor_port = /dev/ttyUSB0

; ---------- SLAVE B: Mtiny WROVER-IE #1 (120 do) ----------
[env:mtiny1]
platform  = espressif32
board     = esp32dev
build_src_filter = +<mtiny1/*>
board_build.partitions = huge_app.csv
build_flags = -DBOARD_HAS_PSRAM
upload_port   = /dev/ttyUSB1   ; Linux: dien dung cong sau khi cam (Windows: COM13)
upload_speed  = 115200

; ---------- SLAVE C: Mtiny WROVER-IE #2 (240 do) ----------
[env:mtiny2]
platform  = espressif32
board     = esp32dev
build_src_filter = +<mtiny2/*>
board_build.partitions = huge_app.csv
build_flags = -DBOARD_HAS_PSRAM
upload_port   = /dev/ttyUSB2   ; Linux: dien dung cong sau khi cam (Windows: COM14)
upload_speed  = 115200

; ============================================================
; QUET RSSI CAM THANG USB (tu 30/09) — CA 3 BOARD DUNG CHUNG src/scanner
;   Khong ESP-NOW, khong WiFi: radio quet BLE 100% thoi gian, moi mau in ra Serial,
;   may tinh lo loc + uoc luong huong. Beacon (s3_esp) giu nguyen.
;   Bo tri: tam giac can, A o dinh (dau xe), B/C o day (sau xe), canh ben 40 cm, day 48 cm.
;
;   Nap TUNG board, chi ro cong (LiDAR SC-Mini cung chip CH340, de pio tu do cong la
;   co the nap nham vao LiDAR):
;     pio run -e scan_a -t upload --upload-port /dev/serial/by-path/<cong cua board A>
;   Cac env mcu / mtiny1 / mtiny2 o tren la kieu ESP-NOW cu, giu lai de quay ve neu can.
; ============================================================
[env:scan_a]            ; NodeMCU-32S — DAU XE (dinh tam giac)
platform  = espressif32
board     = nodemcu-32s
build_src_filter = +<scanner/*>
board_build.partitions = huge_app.csv
build_flags = -DSENSOR_IDX=0

[env:scan_b]            ; Mtiny WROVER-IE #1 — SAU XE, BEN PHAI (nhu firmware cu: 120 do)
platform  = espressif32
board     = esp32dev
build_src_filter = +<scanner/*>
board_build.partitions = huge_app.csv
build_flags = -DBOARD_HAS_PSRAM -DSENSOR_IDX=1
upload_speed  = 115200

[env:scan_c]            ; Mtiny WROVER-IE #2 — SAU XE, BEN TRAI (nhu firmware cu: 240 do)
platform  = espressif32
board     = esp32dev
build_src_filter = +<scanner/*>
board_build.partitions = huge_app.csv
build_flags = -DBOARD_HAS_PSRAM -DSENSOR_IDX=2
upload_speed  = 115200
