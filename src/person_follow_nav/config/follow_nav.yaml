# ============================================================================
# follow_nav.yaml — cau hinh cho robot BW-DR03 bam nguoi + ne vat can
# ----------------------------------------------------------------------------
# CAC THAM SO BAT BUOC PHAI HIEU CHINH TRUOC KHI CHAY THAT (danh dau [*]):
#   lidar_yaw_offset_deg, lidar_angle_sign   -> chay `ros2 run person_follow_nav calibrate_lidar`
#   front_len / rear_len / half_width        -> do thuoc than xe cua ban
#   camera_angle_sign                        -> kiem tra xe quay dung chieu
# ============================================================================

target_tracker_node:
  ros__parameters:
    target_topic_in: "/person_reid/target"
    target_topic_out: "/follow/target"
    marker_topic: "/follow/target_marker"
    scan_topic: "/scan"
    odom_topic: "/odom"
    rssi_angle_topic: "/rssi/angle_deg"
    rssi_conf_topic: "/rssi/confidence"
    odom_frame: "odom"
    base_frame: "base_link"

    # ── [*] Hinh hoc LiDAR ────────────────────────────────────────────────
    # SYSTEM_CONTEXT.md cua ban ghi "goc 90 do la huong thang truoc".
    # Neu dung vay thi offset = -90. HAY CHAY calibrate_lidar DE XAC NHAN.
    lidar_yaw_offset_deg: -90.0
    lidar_angle_sign: 1.0
    lidar_x: 0.10             # lidar dat TRUOC base_link 10cm
    lidar_y: 0.00
    lidar_max_use_range: 8.0

    # ── LOC TIA DAP VAO THAN XE — BAT BUOC ────────────────────────────────
    # LiDAR quet 360 do nen thay ca cot do, day dien, mep san cua CHINH XE.
    # Cac diem do nam trong footprint => rect_clearance()=0 => moi quy dao bi
    # loai => XE KET VINH VIEN o trang thai BLOCKED.
    # Chay de lay so:
    #   ros2 run person_follow_nav calibrate_lidar --ros-args -p mode:=self_scan
    self_filter_enabled: true
    self_filter_margin: 0.03
    # DINH DANG PHANG theo cap [lo1, hi1, lo2, hi2, ...] — ROS 2 khong nhan
    # mang long nhau. Goc tinh trong KHUNG LIDAR, don vi do.
    # [246.0, 294.0] = than xe phia SAU, do bang che do A tren xe nay.
    blind_sectors_deg: [246.0, 294.0]
    front_len: 0.14              # phai trung voi follow_planner_node
    rear_len: 0.33
    half_width: 0.30

    # ── Camera ────────────────────────────────────────────────────────────
    # camera_angle_deg duong = nguoi ben PHAI khung hinh = goc AM trong base_link
    camera_angle_sign: -1.0
    camera_fov_deg: 62.0
    require_identity_ready: true
    camera_msg_timeout_sec: 0.6
    compensate_camera_latency: true     # bu tre YOLO/ReID bang odom — rat quan trong
    max_camera_latency_sec: 0.6

    # ── Ghep LiDAR de lay khoang cach (thay cho bbox height) ──────────────
    use_lidar_distance: true
    assoc_window_deg: 10.0              # cung goc quanh huong camera de tim nguoi
    cluster_gap_m: 0.18
    person_width_min_m: 0.08
    person_width_max_m: 0.90
    person_range_min_m: 0.30
    person_range_max_m: 6.0
    # Cum lidar cach vi tri du doan hon muc nay -> bo (vd. bat nham canh tuong khi nguoi
    # vua khuat sau goc, nguoi thu hai dung chen). Ap dung khi con phep do < 1 s (bbox camera
    # cung tinh) va chua qua lidar_reject_max_sec ke tu lan cuoi lidar khop.
    lidar_distance_max_jump_m: 0.60
    # Cong tren giu hieu luc toi da bay lau sau lan cuoi lidar khop (khi camera van thay
    # nguoi): nguoi thu hai dung chen giua xe va nguoi dang bam se khong bi bam nham trong
    # khoang nay. Qua moc thi nhan lai cum lidar de dong bo, phong du doan troi.
    lidar_reject_max_sec: 3.0
    # Cum lidar gan xe hon vi tri du doan qua muc nay = vat CHAN TRUOC nguoi (nguoi thu hai
    # di ngang/dung sat, thanh cua) -> bo, ca khi ghep theo camera lan lidar_track. 0 = tat.
    occluder_margin_m: 0.30
    # Nhu tren nhung cho LUC CAMERA KHONG THAY (lidar_track), khi nguoi DUNG YEN; nguoi cang di
    # nhanh nguong cang noi (+0.25 m moi m/s, toi da occluder_margin_m). Chat hon vi du doan da tinh
    # van toc nguoi. 0.3 m de lot chan SAU cua nguoi thu hai dung chen ngay truoc nguoi
    # dang bam (chi gan xe hon 0.25 m) -> tracker bam luon nguoi thu hai (29/09).
    lidar_track_occluder_margin_m: 0.15

    # Chi dung khi LiDAR khong thay gi (nguoi bi ban che chan, ...)
    bbox_fallback_enabled: true
    bbox_height_at_1m_px: 420.0         # lay tu follow_controller.yaml cu cua ban

    # ── Bam bang LiDAR khi camera mat hinh ────────────────────────────────
    lidar_only_track_enabled: true
    lidar_only_assoc_radius_m: 0.55
    lidar_only_max_sec: 3.0

    # ── Du doan khi bi che hoan toan ──────────────────────────────────────
    predict_max_sec: 2.5
    # Mat han phep do -> van toc nguoi giam e^(-t/T): du doan dung gan cho thay nguoi
    # LAN CUOI, khong troi thang theo huong cu khi nguoi da re khuat. 0 = tat.
    predict_velocity_decay_sec: 1.0
    # Giua hai phep do (lidar 10 Hz, camera 8 Hz) giu nhan nguon, khong bao "predicted"
    measurement_hold_sec: 0.3
    ab_alpha: 0.55
    ab_beta: 0.10
    max_person_speed: 1.8

    # ── RSSI (du phong) ───────────────────────────────────────────────────
    # TAM TAT: chua cam mach RSSI. Khi nao cam roi thi doi thanh true
    # va them start_rssi:=true vao lenh launch.
    # Tracker van chay binh thuong khi tat — no chi mat lop du phong cuoi cung.
    rssi_enabled: false
    rssi_angle_sign: -1.0
    rssi_min_confidence: 0.20
    rssi_timeout_sec: 2.0
    rssi_takeover_after_sec: 1.2
    rssi_assumed_distance_m: 1.6
    rssi_bearing_blend: 0.35

    update_hz: 20.0
    publish_marker: true
    log_period_sec: 1.0


follow_planner_node:
  ros__parameters:
    target_topic: "/follow/target"
    scan_topic: "/scan"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/follow/planner_status"
    markers_topic: "/follow/debug_markers"
    base_frame: "base_link"

    start_enabled: false                # LUON de false — bat bang service
    control_hz: 15.0

    # ── [*] Hinh hoc LiDAR — PHAI TRUNG voi target_tracker_node ───────────
    lidar_yaw_offset_deg: -90.0
    lidar_angle_sign: 1.0
    lidar_x: 0.10                # lidar dat TRUOC base_link 10cm
    lidar_y: 0.00
    lidar_max_use_range: 5.0
    scan_timeout_sec: 0.6        # SC-Mini chay ~10 Hz (chu ky 0.1s)
    obstacle_bucket_deg: 2.0
    max_obstacle_points: 160
    # Loc tia dap vao than xe — phai trung voi target_tracker_node o tren
    self_filter_enabled: true
    self_filter_margin: 0.03
    blind_sectors_deg: [246.0, 294.0]   # phai trung voi target_tracker_node

    # ── [*] Footprint that — DO TRUC TIEP TREN XE ─────────────────────────
    # base_link = tam giua 2 banh truoc. Xe LECH VE SAU rat nhieu:
    #   mui chi 14cm phia truoc, nhung duoi keo dai 33cm phia sau.
    #   Be ngang 60cm, chieu dai 47cm.
    # Dung hinh CHU NHAT chu khong phai hinh tron — quan trong hon voi xe nay
    # vi front_len va rear_len chenh nhau hon 2 lan.
    front_len: 0.14                     # base_link -> mui xe
    rear_len: 0.33                      # base_link -> duoi xe
    half_width: 0.30                    # nua be ngang
    # Xe rong 0.60m nen khong gian hep la van de that. Da quet tham so:
    #   margin_soft / margin_hard  ->  khe nho nhat thuc te chui duoc
    #        0.22 / 0.08           ->  0.84 m   (ly thuyet 0.76)
    #        0.18 / 0.08           ->  0.84 m
    #        0.15 / 0.06           ->  0.80 m   (ly thuyet 0.72)  <- dang dung
    #        0.12 / 0.05           ->  0.80 m   (ly thuyet 0.70)
    # Ha margin_hard duoi 0.06 KHONG giup them, chi bot an toan.
    margin_soft: 0.15                   # khoang cach MONG MUON toi vat can
    margin_hard: 0.06                   # khoang cach TUYET DOI khong pham
    # Ban kinh ngoai tiep = hypot(rear_len, half_width) = hypot(0.33, 0.30)
    #                     = 0.446 m  <- goc SAU la diem xa tam nhat
    # Duoi dai 33cm nen khi xoay tai cho, duoi VANG RA rat rong.
    rotate_radius: 0.47                 # 0.446 + 2cm du

    # ── Gioi han dong hoc — toc do THAT (driver da hieu chinh max_linear 0.49) ─
    v_max: 0.22
    v_min: -0.06
    # 29/09: 0.80 -> 1.00, accel_ang 1.60 -> 2.40 — nguoi dung thay xe xoay theo nguoi hoi cham.
    # Nguoi di 0.6-1 m/s cach 1 m can ~0.7-1 rad/s. Driver lam duoc 2.46 rad/s (muc 3 CLAUDE.md).
    w_max: 1.00
    accel_lin: 0.35
    accel_ang: 2.40
    min_move_linear: 0.035              # duoi nguong nay banh khong quay
    min_move_angular: 0.10

    # ── Lay mau DWA (tang => muot hon nhung ton CPU hon) ──────────────────
    n_samples_v: 7
    n_samples_w: 17
    horizon_steps: 12
    horizon_dt: 0.10                    # nhin truoc 12 * 0.10 = 1.2 giay
    # Cua so lay mau van toc = accel * sample_window_sec.
    # KHONG de nho bang 1/control_hz — se khien xe dung yen vinh vien (xem README).
    sample_window_sec: 0.5

    # ── Trong so ham chi phi ──────────────────────────────────────────────
    # Xe di lan quan, khong bam sat  -> tang w_goal
    # Xe di sat vat can qua          -> tang w_clear hoac margin_soft
    # Xe giat, doi huong lien tuc    -> tang w_smooth
    # Xe ne xong hay mat nguoi       -> tang w_fov
    # Xe do du trai/phai khi ne      -> tang w_side hoac avoid_side_hold_sec
    w_goal: 2.4
    w_heading: 1.0
    w_clear: 2.2
    w_speed: 0.55
    w_smooth: 0.45
    w_fov: 1.6
    # Giu nguoi GIUA khung hinh suot quy dao DWA (khong chi o diem cuoi 1.2 s). Tang -> xe xoay theo
    # nguoi nhay hon khi nguoi re; qua lon -> luc ne vat can xe cu muon quay ve phia nguoi.
    w_center: 0.8
    w_side: 0.9

    # ── Hanh vi bam ───────────────────────────────────────────────────────
    follow_distance_m: 1.00
    distance_deadband_m: 0.12
    bearing_deadband_deg: 4.0
    max_follow_distance_m: 6.0

    # ── Camera co dinh: co gang giu nguoi trong +-22 do ───────────────────
    camera_fov_deg: 62.0
    fov_keep_deg: 22.0
    fov_cost_only_when_visible: true
    # Camera khong thay nguoi (lidar_track/predicted) va nguoi lech hon goc nay -> xoay
    # tai cho ve huong nho cuoi truoc, xuong duoi mot nua goc nay moi tien toi. Goc du
    # doan thuong tre hon that ~10 do nen dat thap hon nua FOV (31). 0 = tat.
    occluded_turn_deg: 15.0
    # Tang chon khe do toi tan cho nguoi dang bam (tru ban kinh nay quanh ho), khong chi toi
    # dich — nguoi thu hai dung chen thuong dung ngay diem dich. (Dieu kien vao AVOID van do
    # toi dich: do xa hon thi qua khung cua hep hay bi vao AVOID va ep vao thanh cua.)
    target_clear_radius_m: 0.45
    # Duong thang khong lot -> tim khe kieu khung cua rong tu 0.72 m (= be ngang xe +
    # 2*margin_hard) den muc nay, ngam vao truc vuong goc cua khe de canh xe roi chui qua.
    # Xe khong the di cheo qua khe hep (xem CLAUDE.md muc 9). 0 = tat.
    gap_waypoint_max_width_m: 1.20
    # Canh truc khe TRUOC khi chui. Duoi xe dai 0.33 m nen di cheo la goc sau quet ra
    # ngoai khung cua: lech 20 do o cua 0.81 m la cham. Khi xe lech truc duoi gap_axis_tol_m
    # thi coi nhu da vao truc; neu luc do mui xe con lech qua gap_align_deg va con cach mat
    # khe duoi gap_align_range_m, xe DUNG LAI XOAY cho vuong roi moi tien qua.
    # Khe phai mo ra it nhat ngan nay goc nhin tu xe. Chan "khe gia": tia lidar quet DOC
    # theo tuong o goc rat cheo lam hai tia lien nhau cach nhau ca met tren mat tuong,
    # nhin ra nhu khe rong 0.8 m — xe bam vao do roi lao vao tuong canh cua.
    gap_min_span_deg: 10.0
    # Toc do khi chui qua khe (va khi lui ra de vao lai truc khe). Cham de con kip
    # sua lech ngang: o cua 0.81 m, xe rong 0.60 m chi du moi ben ~10 cm.
    gap_cross_speed: 0.12
    # Chi lam dong tac chui khe khi mat khe da o trong tam nay; xa hon thi tang chon khe
    # + DWA lai nhu binh thuong (khong thi xe chay cham suot ca doan duong dai).
    gap_engage_range_m: 1.60
    # Quang duong lui toi da khi phai canh lai truc khe. Lidar KHONG nhin thay gi thang
    # phia sau (cung sau nam trong blind_sectors_deg) nen chi lui dung doan vua di qua.
    gap_back_max_m: 0.40
    # Khoang ho DO DUOC toi thieu giua footprint va vat, CHI trong dong tac chui khe (ngoai do
    # van la margin_hard). Thap hon margin_hard vi xe lay so NHO NHAT trong ~15 tia chieu vao
    # thanh cua: nhieu lidar 1-2 cm keo so do thap hon that 2-3 cm. De 0.06 thi o cua 0.81 m
    # xe tuong chi con 3-4 cm (that 7 cm) va dung im giua cua (nguoi dung bao 29/09).
    # Viec CO NEN chui (da vao truc chua) van tinh bang margin_hard.
    # [CAN XAC NHAN] tren xe that; muon an toan nhu cu thi dat lai 0.06.
    gap_cross_margin_m: 0.03
    gap_axis_tol_m: 0.12
    gap_align_deg: 10.0
    gap_align_range_m: 0.90
    w_gap_align: 3.0

    # ── Tang chon khe (VFH) chay TRUOC DWA ────────────────────────────────
    # Quet cac huong -100..+100 do, thu di duoc bao xa. Thu lan luot tu xa ve gan.
    # Tang so dau -> nhin xa hon, ne som hon. Giam -> phan ung sat hon, o hep tot hon.
    probe_distances: [1.6, 1.1, 0.7, 0.45]
    # Toc do toi thieu (ti le v_max) khi bo sat vat can. 0.25 * 0.22 = 0.055 m/s
    min_speed_scale: 0.25

    # ── Chuyen trang thai ─────────────────────────────────────────────────
    block_corridor_scale: 1.15
    block_enter_sec: 0.25               # chan lien tuc bao lau moi vao AVOID
    block_exit_sec: 0.60                # thoang lien tuc bao lau moi ra khoi AVOID
    avoid_side_hold_sec: 2.0            # khoa ben ne trong 2s -> chong do du trai/phai
    stuck_time_sec: 2.5
    search_after_sec: 1.5
    # Mat nguoi -> truoc khi xoay quet, lai toi cho thay nguoi lan cuoi toi da bay
    # nhieu giay (nguoi re khuat sau goc tuong thi phai toi goc moi thay). 0 = tat.
    search_goto_max_sec: 8.0
    search_w: 0.35
    search_max_sec: 12.0
    min_confidence: 0.15
    target_msg_timeout_sec: 0.8

    publish_markers: true
    log_period_sec: 1.0
