identity_lock_node:
  ros__parameters:
    camera_source: "/dev/v4l/by-id/usb-Generic_KINGSEN_CAMERA_200901010001-video-index0"
    frame_width: 640
    frame_height: 480
    # ── Doc camera KINGSEN (do 30/09) ─────────────────────────────────────
    # 640x480: MJPG toi 25 fps, YUYV chi 15-20 fps (OpenCV tu chon YUYV neu khong dat).
    # Mac dinh camera de backlight_compensation=1 = "che do thieu sang": ha con NUA fps (MJPG
    # 12.5, YUYV 10 fps) va phoi ~80 ms/khung -> nguoi di/xe quay bi nhoe: ReID Rank-1 76.7%
    # -> 59.2%, YOLO mat nguoi o conf 0.55. Tat no + exposure_dynamic_framerate=0 thi len 25 fps.
    # fixed_fps: phan mem tu chinh phoi sang theo do sang, toi da 30 ms (39 ms sat chu ky
    # 40 ms -> camera tut 12.5 fps). Cho rat toi (log bao "Anh toi") thi doi sang "auto".
    # Mo camera xong can ~7-30 s camera moi len 25 fps (trung thoi gian enroll).
    # 640x480 la anh CAT GIUA 1440x1080 cua cam bien (do bang so khop anh 30/09).
    camera_fourcc: "MJPG"
    camera_fps: 25.0
    camera_exposure_mode: "fixed_fps"
    camera_exposure_ms: 30.0          # bat dau o muc toi da: phong binh thuong can muc nay, it phai doi
    camera_exposure_min_ms: 1.0
    camera_exposure_max_ms: 30.0
    camera_exposure_step_ms: 10.0      # boi so 10 ms: khong nhap nhay duoi den dien 50 Hz
    camera_brightness_target: 120.0
    # 50 Hz (dien Viet Nam; camera dang de 60 Hz); tat che do thieu sang (ha nua fps)
    camera_v4l2_controls: "backlight_compensation=0,exposure_dynamic_framerate=0,power_line_frequency=1"

    # ── Mo hinh (09/10): YOLO26n + OSNet x0.5 chay bang onnxruntime ─────────
    # Do tren du lieu THAT tu camera nay (~/reid_data/20261009_145308, 2 nguoi, 8 pha; scripts/
    # eval_detector_data.py, eval_reid_data.py, replay_identity.py):
    #  - YOLO26n 416x320 @0.30: dung so nguoi 91.8% (YOLOv5n 640 dang dung: 91.3%), pha kho 85.5% (85.2%),
    #    6.4 ms so voi 19.9 ms. YOLOv5n ha xuong 416 thi kem han (83.6%, thua hop 7.8%).
    #  - OSNet x0.5 (MSMT17): nguoi la toi da 0.707 so voi kho chu, chu p5 0.798 (ckpt.t7: nguoi la trung vi
    #    0.794, toi da 0.870 — de hon nguong nhan lai cu 0.80/0.85). Chay lai toan bo logic tren doan quay:
    #    KHOA NHAM 227/2630 khung (8.6%, pha chi co B 60%, dot dai 8.9 s) -> 2/2630 (0.1%, ca hai la hop
    #    du doan 1 khung khi YOLO sot); bam chu o pha tu do 47.5% -> 59.4%.
    #  - Ca pipeline, 2 loi (gia lap mini PC i5-5200U), 4 nguoi: 70.6 ms/khung -> ~21 ms.
    # Can: pip install --user --no-deps onnxruntime (chay duoc voi numpy 1.26 cua ROS).
    # QUAY LAI ban cu: detector_onnx: "", reid_onnx: "", det_conf_thres 0.40, deepsort_max_dist 0.18 va
    # cac nguong ReID ghi "(ckpt.t7: ...)" ben duoi. Ten ngan = file trong person_reid_tracker/model_assets.
    detector_onnx: "yolo26n_416x320.onnx"     # kich thuoc vao CO DINH 416x320 (img_size / rect_inference chi cho ban PyTorch)
    reid_onnx: "osnet_x0_5_msmt17.onnx"       # nhe hon: osnet_x0_25_msmt17.onnx (phai doi nguong, xem eval_reid_data.py)
    ort_threads: 2                            # mini PC 2 loi; may hien tai cung du (pipeline ~10 ms)
    model_weights: ""
    deepsort_ckpt: ""
    device: "auto"
    use_cuda: true
    img_size: 640
    # YOLO chay khung 640x480 thay vi dem thanh 640x640 (~20 ms -> ~15 ms tren CPU)
    rect_inference: true

    # 0.55 -> 0.40 (30/09): nguoi o gan bi cat khung (chi thay chan, hoac goi toi nguc) YOLOv5n
    # chi cho conf ~0.4-0.7 (do tren anh nguoi that bi cat); o 0.55 hay mat nguoi dang bam o 1 m.
    # Doi lai phat hien sai (khong phai nguoi) tang 2 -> 6 tren 128 anh coco128 — khoa ReID loai.
    # YOLO26n: 0.30 tot hon 0.40 tren du lieu that (dung so nguoi 91.8% / 91.0%, pha kho 85.5% / 83.5%,
    # bao thua 0.3% / 0.0%) — nguoi la / vat la bi khoa ReID loai. (YOLOv5n PyTorch: 0.40)
    det_conf_thres: 0.30
    det_iou_thres: 0.50
    person_class_id: 0

    deepsort_max_age: 30
    deepsort_n_init: 4
    # Cong khoang cach cosine cua DeepSORT theo thang OSNet x0.5: cung track khung ke p99 0.185 / p99.9 0.328,
    # A-B cung khung p0.1 0.366 / p1 0.405. (ckpt.t7: 0.18 — nam ngay A-B p1 0.182, de trao ID)
    deepsort_max_dist: 0.30

    min_stable_frames: 4
    min_bbox_area: 1800
    initial_select_mode: "center_largest"
    auto_enroll_on_start: false
    enroll_seconds: 30.0
    enroll_min_samples: 80
    enroll_sample_every_n_frames: 3

    positive_gallery_size: 160
    negative_gallery_size: 320   # gallery am tach theo nguoi (~40 nguoi); nguoi mac giong can nhieu mau
    color_gallery_size: 100
    reid_match_mode: "topk_mean"
    reid_top_k: 5

    # ── Nguong ReID (09/10, theo thang OSNet x0.5) ─────────────────────────
    # Tu du lieu that 09/10 (kho chu = 160 mau enroll, top-5 mean): chu p1 0.648 p5 0.798 p10 0.840 p20 0.869
    # p50 0.904; nguoi la p50 0.567 p99 0.674 toi da 0.707; cung nguoi cach 0.5 s p1 0.624; A-B cung khung p99
    # 0.595. Nguyen tac: nhan lai / hoc kho chu phai CAO HON muc toi da cua nguoi la; khoang chenh nhan
    # 2.65 lan (do gian thang: chu p50 - nguoi la p50 = 0.337 so voi 0.127 cua ckpt.t7).
    # Ban cu (29/09, ckpt.t7) dat theo Market-1501 — ghi trong ngoac "(ckpt.t7: ...)" de quay lai.
    reid_threshold: 0.78          # "khop chac" ~ chu p4; duoi muc nay moi xet track doi ngoai hinh dot ngot (ckpt.t7: 0.82)
    current_min_reid: 0.60        # giu khoa: duoi chu p1 0.648, tren nguoi la p50 0.567 (ckpt.t7: 0.70)
    current_min_combined: 0.54    # (ckpt.t7: 0.62) — 0.79*reid + 0.21*mau, doi theo current_min_reid
    current_min_color: 0.20       # chi loai khi lech mau ro (truoc 0.28 = p1 cua nguoi that)
    recover_min_combined: 0.66    # (ckpt.t7: 0.72)
    recover_min_reid: 0.72        # tren nguoi la toi da 0.707; ~97% khung cua chu qua (ckpt.t7: 0.80 ~ nguoi la p50!)
    recover_min_color: 0.25
    recover_strong_reid: 0.86     # khop manh: +2 bang chung, ~chu p17 (ckpt.t7: 0.88)
    reid_margin: 0.10             # hon nguoi giong thu hai it nhat bay nhieu (moi khung) (ckpt.t7: 0.04)
    combined_margin: 0.07         # (ckpt.t7: 0.03)
    negative_margin: 0.08         # pos - (giong nguoi da biet) khi tim lai (ckpt.t7: 0.03)
    current_negative_margin: 0.0  # giu khoa: khong duoc giong nguoi da biet hon muc tieu
    strong_negative_margin: 0.10  # anh sach ma giong nguoi da biet hon muc tieu 0.10 -> bo khoa ngay (ckpt.t7: 0.04)
    switch_margin: 0.20           # nguoi khac giong muc tieu hon track dang khoa 0.20 -> bo khoa ngay (ckpt.t7: 0.08)
    self_consistency_min: 0.60    # cung nguoi cach 0.5 s p1 0.624; A-B cung khung p99 0.595 (ckpt.t7: 0.72)
    # So lan kiem tra hong LIEN TIEP (anh sach) truoc khi bo khoa. Truoc 1: mot khung bi
    # che mot phan / quay lung la mat khoa -> phai tim lai tu dau.
    verification_fail_limit: 3
    occluded_fail_weight: 0.25    # khung bi che chi tru 1/4 bang chung
    occlusion_ratio_max: 0.35
    learn_min_quality: 0.75
    eval_min_quality: 0.45

    verify_every_n_frames: 1      # feature lay lai tu DeepSORT nen kiem tra moi khung gan nhu mien phi
    update_gallery_every_n_frames: 3
    # Hoc them vao kho chu chi khi tren muc toi da cua nguoi la 0.707: lo khoa nham cung khong hoc ngoai hinh
    # nguoi la vao kho chu (ban cu 0.70 < nguoi la p50 0.794: khoa nham B roi hoc luon B, diem tang 0.86 -> 0.95)
    target_update_min_similarity: 0.72   # (ckpt.t7: 0.70)
    max_duplicate_similarity: 0.95       # OSNet: khung ke tiep giong ~0.956 (ckpt.t7: 0.985 ~ 0.987)
    negative_add_max_reid: 0.60          # (ckpt.t7: 0.65)
    # Khi khoa da tin cay: hoc MOI nguoi khac lam 'khong phai muc tieu', ke ca nguoi giong
    # hon track dang khoa toi 0.05. Hoc nham chi lam kho nhan lai (an toan); khong hoc nguoi
    # mac giong thi luc muc tieu khuat se nhan nham ho (nguy hiem).
    negative_add_min_margin: -0.13       # (ckpt.t7: -0.05)
    view_bucket_min_samples: 5
    bucket_bootstrap_frames: 8
    edge_margin_px: 6

    # Strict policy: A lost => robot/controller stop. Do not auto-lock B.
    # spatial_gate_px vẫn dùng cho mất dấu ngắn/tại chỗ (nhanh, rẻ).
    # Sau khi robot XOAY LỚN để né vật (lidar_enhancer), vị trí pixel cũ của A
    # không còn ý nghĩa nữa -> nếu global recovery tắt, hệ thống sẽ luôn trả
    # về "spatial_gate_rejected" dù camera đã thấy đúng A. Mở global recovery
    # với ngưỡng ReID vẫn NGHIÊM để bù lại việc bỏ điều kiện vị trí pixel.
    spatial_gate_px: 140.0
    global_search_after_sec: 1.5
    global_search_min_reid: 0.76         # giua nguoi la toi da 0.707 va chu p5 0.798 (ckpt.t7: 0.86)
    enable_global_recovery: true
    allow_single_candidate_global_recovery: false
    # Diem bang chung can de nhan lai (khop thuong +1, khop manh +2, hong -1).
    # Track vua bi nghi tron ID bat dau tu -suspect_penalty.
    recovery_confirm_frames: 3
    suspect_penalty: 2.0
    # Muc tieu bien mat khi dang chong voi nguoi khac -> coi la dang nup sau ho trong ngan
    # nay giay: can them 1 diem bang chung, nguoi da thay cung luc voi muc tieu bi chan.
    occluded_loss_hold_sec: 2.5
    # Vua nhan lai: trong ngan nay giay, ai giong muc tieu hon track dang khoa >= 0.03 la
    # mot lan hong -> nhan nham nguoi mac giong thi chuyen nhanh sang nguoi dung.
    recovery_probation_sec: 3.0
    # Chi mot nguoi trong khung sau khi mat chu = ca nguy hiem nhat (09/10: ban cu nhan nham B o 0.856 khi kho
    # nguoi la con TRONG vi B chua tung dung cung luc voi chu)
    recovery_single_candidate_min_reid: 0.76       # (ckpt.t7: 0.85)
    recovery_single_candidate_min_combined: 0.68   # (ckpt.t7: 0.75)
    max_lost_keep_id_sec: 3.0

    reid_weight: 0.75
    color_weight: 0.20
    gait_identity_weight: 0.10

    # Gait TAT (29/09): mediapipe 0.10.35 da bo mp.solutions -> MediaPipe Pose khong chay,
    # "gait" chi con dac trung bong (Otsu, ti le bbox) — doi theo khoang cach/bi cat khung
    # hon la theo nguoi, lai BAT BUOC khi tim lai (cho du 6 khung) -> nhan lai cham, hay loai nham.
    enable_gait: false
    gait_required_for_recovery: true
    gait_required_for_enrollment: true
    gait_sample_every_n_frames: 1
    gait_window: 45
    gait_min_frames: 6
    gait_gallery_size: 80
    gait_current_min_score: 0.45
    gait_recovery_min_score: 0.50
    gait_model_complexity: 1
    gait_min_detection_confidence: 0.20
    gait_min_tracking_confidence: 0.20
    gait_min_landmark_visibility: 0.0

    # FOV ngang THAT o 640x480 — nguoi dung do 30/09 bang thuoc (scripts/measure_fov.py, 5 vach):
    # camera cach tuong 1.00 m, vach 1->3 98.5 cm, 3->5 54 cm, 5->7 54 cm, 7->9 98.5 cm.
    # So 62 cu SAI: goc nguoi lech giua khung bi bao ~mot nua goc that (that 30 do -> bao 14-19),
    # lot khoi cua so +-10 do tracker dung de ghep cum chan LiDAR.
    camera_fov_deg: 114.4
    # Ong KINGSEN la "mat ca deu": goc ti le thuan voi pixel (x=160 px -> 28.4 do, mep -> 56.7 do;
    # pinhole se ra 37.8 do, sai 9 do). Tham so khop tu 5 vach (sai so 0.1 px):
    camera_angle_model: "calibrated"
    # Goc NGUA LEN cua camera (do). FOV doc 85.4 do: camera 34 cm nhin ngang, o 1 m thay tu san
    # toi ~1.26 m (thieu vai, dau); ngua ~12 do thay toan than o 1 m. Lap nghieng bao nhieu thi
    # ghi bay nhieu.
    camera_pitch_deg: 0.0
    camera_matrix: [324.00, 0.0, 320.0, 0.0, 324.00, 240.0, 0.0, 0.0, 1.0]
    dist_coeffs: [-0.01077, 0.0, 0.0, 0.0]
    camera_fisheye: true
    # KHONG bat voi ong mat ca 114 do: khu meo ve pinhole keo gian mep ~1.5 lan, goc anh ~2.3 lan
    undistort_frame: false
    undistort_balance: 0.0

    draw_all_tracks: true
    publish_debug_image: true
    target_topic: "/person_reid/target"
    debug_image_topic: "/person_reid/debug_image"
    command_topic: "/person_reid/command"
    start_enroll_service: "/person_reid/start_enroll"
    finish_enroll_service: "/person_reid/finish_enroll"
    reset_service: "/person_reid/reset"

    # Truoc 8 Hz (bi chan boi timer, khong phai CPU). Sau khi dung lai feature + khung
    # 640x480, 3-5 nguoi ~30-45 ms/khung. [CAN XAC NHAN] /cmd_vel van >= 10 Hz tren xe.
    processing_hz: 15.0
    frame_skip: 0
    show_window: true
    stats_period_sec: 10.0
